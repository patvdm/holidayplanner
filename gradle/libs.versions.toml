[versions]
agp = "9.3.2"
kotlin = "2.2.10"
ksp = "2.3.12"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
robolectric = "4.17"
testCore = "1.7.0"
espressoCore = "3.7.0"
lifecycle = "2.11.0"
